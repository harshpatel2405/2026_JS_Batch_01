<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 450px;
            width: 300px;
            border: 2px solid red;
        }

        img {
            width: 250px;
            height: 350px;
        }
        h2{
            text-align: center;
        }
    </style>
</head>

<body>
    <div >
        <!-- <img id='image' src="https://media.geeksforgeeks.org/wp-content/uploads/ONbulb.jpg" onclick="changeImage()"> -->

        <img id='image' src="https://media.geeksforgeeks.org/wp-content/uploads/ONbulb.jpg" >
        <button onclick="changeImage()" type="button">Click to change</button>

        <h2 id="status">ISON : true</h2>
    </div>

    <script>
        let ison = true
        let image = document.getElementById('image')
        let status = document.getElementById("status")
        function changeImage() {
            if (ison) {
                image.setAttribute('src', "https://media.geeksforgeeks.org/wp-content/uploads/OFFbulb.jpg")
            }
            else {
                image.setAttribute('src', "https://media.geeksforgeeks.org/wp-content/uploads/ONbulb.jpg")
            }
            ison = !ison;
            status.innerText = "ISON : " + ison
        }
    </script>
</body>

</html>
