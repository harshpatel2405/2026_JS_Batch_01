<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            height: 200px;
            width: 400px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <input type="number" id="data">
    <button type="button" onclick="addElement()">Click to add</button>
    <button type="button" onclick="removeElement()">Click to Remove</button>
    <h3 id="arr"></h3>
    <h2 id="add">Sum : 0</h2>

    <div id="new1">

    </div>

    <script>
        let num = []
        let arr = document.getElementById("arr");
        let add = document.getElementById("add");
        let ch = "hello";
        function addElement() {
            let data = document.getElementById("data")
            if (data.value != "") {
                num.push(parseInt(data.value))
                arr.innerText = num.map((n) => n)
                data.value = ""
                add.innerText = "Sum : " + num.reduce((acc, curr) => acc + curr)
            }
        }

        let new1 = document.getElementById("new1");
        function removeElement() {

            new1.innerHTML = "";

            let label = document.createElement("label");
            let inputbox = document.createElement("input");
            let button = document.createElement("button");

            label.innerText = "Select Choice : ";

            inputbox.type = "number";
            inputbox.id = "choiceInput";
            inputbox.placeholder = "1. Index  2. Value";

            button.type = "button";
            button.innerText = "Submit";

            button.onclick = choice;

            new1.append(label, inputbox, button);
        }

        function choice() {

            let ch = Number(document.getElementById("choiceInput").value);

            console.log(ch);

            if (ch == 1) {
                removeByIndex();
            } else {
                removeByValue();
            }

            // new1.innerHTML = "Choice : " + ch;
        }

        function removeByValue()
        {
            let label = document.createElement("label");
            let inputbox = document.createElement("input");
            let button = document.createElement("button");

            label.innerText = "Enter Value : ";

            inputbox.type = "number";
            inputbox.id = "choicevalue";
            inputbox.placeholder = "Enter value to be deleted";

            button.type = "button";
            button.innerText = "Submit";

            button.onclick = getValue;

            new1.append(label, inputbox, button);
        }

        function getValue()
        {
             let value = document.getElementById("choicevalue").value

            num = num.filter((n)=> n != value)
            arr.innerHTML = ""
            arr.innerHTML = num
        }

        function removeByIndex() {
            let label = document.createElement("label");
            let inputbox = document.createElement("input");
            let button = document.createElement("button");

            label.innerText = "Enter Index : ";

            inputbox.type = "number";
            inputbox.id = "choiceIndex";
            inputbox.placeholder = "Enter index to be deleted";

            button.type = "button";
            button.innerText = "Submit";

            button.onclick = getindex;

            new1.append(label, inputbox, button);
        }

        function getindex() {
            let index = document.getElementById("choiceIndex").value

            num.splice(index,1)
            arr.innerHTML = ""
            arr.innerHTML = num
        }

    </script>

</body>

</html>

<!-- 
 * ask if user wants to delete a number , 
 *    1. by index
 *    2. by value
 -->
