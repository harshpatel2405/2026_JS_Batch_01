<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: pink;
            background-color: gray;
        }

        .data {
            margin: 0 auto;
            margin-top: 10px;
            height: 300px;
            width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
        }

        .result {
            margin-top: 20px;
        }

        button {
            width: 20vw;
            height: 10vh;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 1px 2px 3px pink;
        }
    </style>
</head>

<body>
    <div class="data">
        <form>
            <label>Enter Number 1 : </label>
            <input type="number" id="num1">
            <span id="error1"></span>
            <br>
            <br>
            <label>Enter Number 2 : </label>
            <input type="number" id="num2">
            <span id="error2"></span>

            <br>
            <br>
            <button type="button" onclick="add()">Add Two Numbers</button>
            <button type="button" onclick="subtract()">Subtract Two Numbers</button>
        </form>

        <div class="result">
            <h3 id="result"></h3>
        </div>
    </div>
    <script>
        let num1 = document.getElementById("num1")
        let num2 = document.getElementById("num2")
        let result = document.getElementById("result")
        let error1 = document.getElementById("error1")
        let error2 = document.getElementById("error2")



        function add() {
            if (num1.value == '') {
                error1.style.color = "black"
                error1.innerText = "Value is Required"
                return;
            }
            if (num2.value == '') {
                error1.innerText = ''
                error2.style.color = "black"
                error2.innerText = "Value is Required"
                return;
            }

            let ans = parseInt(num1.value) + parseInt(num2.value)
            error2.innerText = ""
            error1.innerText = ""
            result.innerText = "Addition of " + num1.value + " and " + num2.value + " is " + ans;
        }
        function subtract() {
            if (num1.value == '') {
                error1.style.color = "black"
                error1.innerText = "Value is Required"
                return;
            }
            if (num2.value == '') {
                error1.innerText = ''
                error2.style.color = "black"
                error2.innerText = "Value is Required"
                return;
            }

            let ans = parseInt(num1.value) - parseInt(num2.value)
            error2.innerText = ""
            error1.innerText = ""
            result.innerText = "Subtraction of " + num1.value + " and " + num2.value + " is " + ans;
        }
    </script>
</body>

</html>
